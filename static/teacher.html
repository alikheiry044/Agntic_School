<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل دبیر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="navbar">
            <h2><i class="fa-solid fa-chalkboard-user"></i> پنل دبیر</h2>
            <button onclick="logout()" class="btn-submit" style="width: auto; padding: 8px 16px;">خروج</button>
        </div>

        <!-- ثبت نمره -->
        <div class="card">
            <h3><i class="fa-solid fa-pen-to-square"></i> ثبت نمره</h3>
            <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
                <input type="number" id="grade-student-id" placeholder="شناسه دانش‌آموز (Student ID)">
                <input type="text" id="grade-subject" placeholder="نام درس">
                <input type="number" step="0.25" id="grade-value" placeholder="نمره (مثلاً 18.5)">
                <input type="text" id="grade-date" placeholder="تاریخ شمسی (مثلاً ۱۴۰۵/۰۶/۲۱)">
                <button onclick="submitGrade()" class="btn-submit">ثبت نمره</button>
            </div>
        </div>

        <!-- ثبت حضور و غیاب -->
        <div class="card">
            <h3><i class="fa-solid fa-calendar-check"></i> ثبت حضور و غیاب</h3>
            <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
                <input type="number" id="attendance-student-id" placeholder="شناسه دانش‌آموز (Student ID)">
                <input type="text" id="attendance-date" placeholder="تاریخ شمسی (مثلاً ۱۴۰۵/۰۶/۲۱)">
                <select id="attendance-status">
                    <option value="present">حاضر</option>
                    <option value="absent">غایب</option>
                </select>
                <button onclick="submitAttendance()" class="btn-submit">ثبت حضور و غیاب</button>
            </div>
        </div>

        <!-- گزارش ماهانه برای اولیا -->
        <div class="card">
            <h3><i class="fa-solid fa-file-lines"></i> ارسال گزارش ماهانه برای اولیا</h3>
            <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
                <input type="number" id="report-student-id" placeholder="شناسه دانش‌آموز (Student ID)">
                <input type="text" id="report-month" placeholder="ماه (مثلاً شهریور)">
                <input type="text" id="report-academic" placeholder="وضعیت تحصیلی">
                <input type="text" id="report-disciplinary" placeholder="وضعیت انضباطی">
                <button onclick="submitMonthlyReport()" class="btn-submit">ارسال گزارش (در انتظار تأیید مدیر)</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        // ===== تبدیل تاریخ شمسی به میلادی (برای ثبت صحیح در دیتابیس) =====
        function jalaliToGregorian(jy, jm, jd) {
            jy = parseInt(jy, 10) + 1595;
            let days = -355668 + 365 * jy + Math.floor(jy / 33) * 8
                + Math.floor(((jy % 33) + 3) / 4) + jd
                + (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
            let gy = 400 * Math.floor(days / 146097);
            days %= 146097;
            if (days > 36524) {
                gy += 100 * Math.floor(--days / 36524);
                days %= 36524;
                if (days >= 365) days++;
            }
            gy += 4 * Math.floor(days / 1461);
            days %= 1461;
            if (days > 365) {
                gy += Math.floor((days - 1) / 365);
                days = (days - 1) % 365;
            }
            let gd = days + 1;
            const leap = (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0;
            const salA = [0, 31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            let gm = 0;
            for (gm = 1; gm <= 12 && gd > salA[gm]; gm++) gd -= salA[gm];
            const pad = (n) => String(n).padStart(2, "0");
            return `${gy}-${pad(gm)}-${pad(gd)}`;
        }

        function toEnglishDigits(str) {
            return str.replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
        }

        function parseJalali(value) {
            const clean = toEnglishDigits(value.trim());
            const m = clean.match(/^(\d{4})[/\-](\d{1,2})[/\-](\d{1,2})$/);
            if (!m) return null;
            return jalaliToGregorian(+m[1], +m[2], +m[3]);
        }

        // ===== ثبت نمره با تبدیل تاریخ =====
        const _origSubmitGrade = submitGrade;
        submitGrade = async function () {
            const raw = document.getElementById("grade-date").value;
            const g = parseJalali(raw);
            if (!g) { alert("تاریخ را به‌صورت ۱۴۰۵/۰۶/۲۱ وارد کنید"); return; }
            await _origSubmitGradeWithDate(g);
        };

        async function _origSubmitGradeWithDate(gregorianDate) {
            const studentId = document.getElementById("grade-student-id").value;
            const subject = document.getElementById("grade-subject").value;
            const score = document.getElementById("grade-value").value;
            try {
                const response = await fetch(API_BASE + "/teacher/grades", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + localStorage.getItem("token")
                    },
                    body: JSON.stringify({
                        student_id: parseInt(studentId),
                        subject: subject,
                        score: parseFloat(score),
                        date: gregorianDate
                    })
                });
                if (response.ok) {
                    alert("نمره با موفقیت ثبت شد");
                } else {
                    const err = await response.json();
                    alert("خطا: " + (err.detail || "ثبت نمره انجام نشد"));
                }
            } catch (err) {
                alert("خطا در برقراری ارتباط با سرور");
            }
        }

        // ===== ثبت حضور و غیاب با تبدیل تاریخ =====
        const _origSubmitAttendance = submitAttendance;
        submitAttendance = async function () {
            const raw = document.getElementById("attendance-date").value;
            const g = parseJalali(raw);
            if (!g) { alert("تاریخ را به‌صورت ۱۴۰۵/۰۶/۲۱ وارد کنید"); return; }
            const studentId = document.getElementById("attendance-student-id").value;
            const status = document.getElementById("attendance-status").value;
            try {
                const response = await fetch(API_BASE + "/teacher/attendance", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + localStorage.getItem("token")
                    },
                    body: JSON.stringify({
                        student_id: parseInt(studentId),
                        date: g,
                        status: status
                    })
                });
                if (response.ok) {
                    alert("حضور و غیاب با موفقیت ثبت شد");
                } else {
                    const err = await response.json();
                    alert("خطا: " + (err.detail || "ثبت انجام نشد"));
                }
            } catch (err) {
                alert("خطا در برقراری ارتباط با سرور");
            }
        };
    </script>
</body>
</html>
