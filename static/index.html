<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه هوشمند مدرسه</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="box">
        <div class="login">
            <form id="loginForm" class="loginBx">
                <h2><i class="fa-solid fa-graduation-cap"></i> مدرسه هوشمند</h2>

                <div id="errorAlert" class="alert-danger"></div>

                <select id="roleSelect" onchange="toggleRoleFields()">
                    <option value="admin">مدیر سیستم</option>
                    <option value="teacher">دبیر</option>
                </select>

                <input type="text" id="usernameInput" placeholder="نام کاربری" required>
                <input type="password" id="passwordInput" placeholder="رمز عبور" required>

                <button type="submit" class="btn-submit">ورود به سامانه</button>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
